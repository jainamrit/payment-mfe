<div class="payment-card">

  <h2>Premium Payment</h2>

  <p>Your Premium Amount:</p>
  <h3>₹ {{ premiumAmount }}</h3>

  <button (click)="payPremium()" class="pay-btn" [disabled]="isProcessing">

    <span *ngIf="!isProcessing">Pay Now</span>

    <span *ngIf="isProcessing" class="spinner-container">
      <span class="spinner"></span>
      Processing...
    </span>

  </button>

  <div *ngIf="finalAmount && !isProcessing" class="success-msg">
    {{ finalAmount }} !!!
  </div>

</div>
